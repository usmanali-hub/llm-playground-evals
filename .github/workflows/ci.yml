name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest
      - name: Offline demo
        run: python -m llm_playground chat --provider fake --system "Answer briefly." --stream "What is a token?"
      - run: python examples/repair_demo.py
      - run: python examples/patterns_demo.py
      - run: python examples/tracking_demo.py
      - run: python examples/caching_demo.py
